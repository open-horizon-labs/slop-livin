name: Release

# Tag pushes are the single release trigger (`git tag vX.Y.Z && git push --tags`,
# or `gh release create`, which pushes the tag). One job: an optimized
# aarch64-apple-darwin build of the CLI/TUI binary, packaged with the
# skills/swamp/ agent skill as a tarball with a checksum, attached to the
# GitHub release. There is no separate MCP server binary (removed #104):
# the CLI's --json output plus the packaged skill is the agent interface.
#
# Runner: the org's local Apple-silicon builder when LOCAL_MACOS_CI_ENABLED
# is set (same toggle unified-hifi-control uses), otherwise GitHub's hosted
# macOS runner. sccache fronts rustc either way.
#
# The fleet runner is a persistent VM: target/ and ~/.cargo already survive
# between jobs on its own disk (see docs/artium-enrollment.md upstream in
# homelab-infra), so round-tripping either cache through GitHub's actions-cache
# backend there is pure waste, and a large enough one to stall the upload
# outright. Both caches route through GitHub's backend only on the ephemeral
# macos-latest fallback, where that round trip is the only way to keep
# anything between jobs at all.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: ${{ vars.LOCAL_MACOS_CI_ENABLED == 'true' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cargo cache
        if: vars.LOCAL_MACOS_CI_ENABLED != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-arm64

      - name: Version
        id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (release, aarch64-apple-darwin)
        env:
          SCCACHE_GHA_ENABLED: "${{ vars.LOCAL_MACOS_CI_ENABLED != 'true' }}"
          RUSTC_WRAPPER: sccache
        run: cargo build --release --locked --target aarch64-apple-darwin -p swamp

      # Same profile and target as the build: the library and binary
      # crates are already compiled above, so only the test harnesses are
      # new work, and the tests exercise the optimized code that ships.
      # A plain `cargo test` here recompiled the whole workspace in debug.
      - name: Test (release, aarch64-apple-darwin)
        env:
          SCCACHE_GHA_ENABLED: "${{ vars.LOCAL_MACOS_CI_ENABLED != 'true' }}"
          RUSTC_WRAPPER: sccache
        run: cargo test --workspace --locked --release --target aarch64-apple-darwin

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          out="swamp-${v}-aarch64-apple-darwin"
          latest_out="swamp-aarch64-apple-darwin"
          mkdir -p "dist/${out}"
          cp target/aarch64-apple-darwin/release/swamp "dist/${out}/"
          cp README.md "dist/${out}/"
          cp -R skills "dist/${out}/skills"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          (cd dist && shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256")
          mkdir -p "dist/${latest_out}"
          cp target/aarch64-apple-darwin/release/swamp "dist/${latest_out}/"
          cp README.md "dist/${latest_out}/"
          cp -R skills "dist/${latest_out}/skills"
          tar -C dist -czf "dist/${latest_out}.tar.gz" "${latest_out}"
          (cd dist && shasum -a 256 "${latest_out}.tar.gz" > "${latest_out}.tar.gz.sha256")
          echo "tarball=dist/${out}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=dist/${out}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Smoke
        run: |
          set -euo pipefail
          ./target/aarch64-apple-darwin/release/swamp --help | head -3
          # The binary must report the version being released.
          test "$(./target/aarch64-apple-darwin/release/swamp --version)" = "swamp ${{ steps.v.outputs.version }}"
          # The agent interface is the CLI's own --json output plus the
          # packaged skill, not a separate server: exercise both.
          test -f skills/swamp/SKILL.md
          ./target/aarch64-apple-darwin/release/swamp report . --json --no-observe | grep -q '"projects"'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swamp-macos-arm64
          path: dist/*

      # Release notes are written by a human in CHANGELOG.md under
      # `## vX.Y.Z`; the release fails if the tag has no entry. Generated
      # notes are a commit list and have already misdescribed this project
      # once (they listed the abandoned first attempt's PRs).
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          v="${GITHUB_REF#refs/tags/}"
          awk -v tag="$v" '
            $0 ~ "^## " tag "([[:space:]]|$)" { on=1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section '## $v' — write the release notes before tagging." >&2
            exit 1
          fi
          {
            echo
            echo "### Install (macOS, Apple silicon)"
            echo '```bash'
            echo 'brew install open-horizon-labs/tap/swamp'
            echo 'swamp --version'
            echo '```'
            echo 'Update with `brew upgrade swamp`. The tap checks for new releases every 15 minutes; GitHub may delay scheduled updates. Versioned archives are also attached below.'
          } >> release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.sha }}
          body_path: release-notes.md
