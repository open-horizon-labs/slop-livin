[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/harvest",
    "crates/source-audit",
    "crates/tui",
]

[workspace.package]
edition = "2024"
version = "0.6.3"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arrow-array = "56"
arrow-schema = "56"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
parquet = { version = "56", features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
